name: Deploy (CVM Pull Mode & Git Pages Redirect)

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    # 1. 构建：主站 + 所有子项目，产物合并到 dist-preview
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Cache VitePress build cache
              uses: actions/cache@v6
              with:
                  path: |
                      docs/.vitepress/cache
                      vue-TelemetryInstruments/node_modules/.vite
                  key: ${{ runner.os }}-vitepress-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-vitepress-

            - name: Install & Build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: dist-preview
                  retention-days: 1

    # 2. 部署到 dist 分支（CVM 拉取模式）+ 触发钩子
    # 仅本仓库执行（旧 fork 工作流已弃用）
    deploy_dist:
        if: github.repository == 'KukuhakuAsso/ku2hakuasso.site'
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@v7

            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                  name: site
                  path: dist-preview

            #把编译好的静态网页，推送到当前仓库的 dist 分支
            - name: Push Assets to Dist Branch
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: dist-preview # 编译产物目录
                  branch: dist # 专门存放打包后文件的分支（会自动创建）
                  token: ${{ secrets.GITHUB_TOKEN }} # 无需配置，GitHub 自动生成

            # 把构建产物打包成压缩包，发布到固定 build-latest Release
            - name: Pack site
              run: tar -czf site.tar.gz -C dist-preview .

            - name: Publish build release
              run: |
                  gh release delete build-latest --yes --cleanup-tag || true
                  gh release create build-latest site.tar.gz \
                    --title "Latest site build" \
                    --notes "自动构建产物，供 CVM 拉取" \
                    --latest

            # 通知 CVM（异步）：GitHub 通知CVM 执行部署。
            # 需要两个宝塔 webhook 入口：
            #   HOOK_URL        = 触发入口
            #   HOOK_STATUS_URL = 状态入口
            # 之后尽力轮询部署状态；无论是否拿到状态，都只发警告、不判失败。
            - name: Trigger hook (异步通知 + 状态查询)
              run: |
                  HOOK_URL="${{ secrets.HOOK_URL }}"
                  STATUS_URL="${{ secrets.HOOK_STATUS_URL }}"
                  # 宝塔用 query 的 param 传给脚本 $1；这里只传本次 run_id（纯数字，无需 URL 编码）
                  case "$HOOK_URL" in
                      *\?*) TRIGGER_URL="$HOOK_URL&param=${{ github.run_id }}" ;;
                      *)    TRIGGER_URL="$HOOK_URL?param=${{ github.run_id }}" ;;
                  esac

                  if [ -z "$HOOK_URL" ]; then
                      echo "::warning::secrets.HOOK_URL 未配置，CVM 未收到通知，站点可能未更新"
                      exit 0
                  fi
                  if [ -n "$STATUS_URL" ] && [ "$STATUS_URL" = "$HOOK_URL" ]; then
                      echo "::warning::HOOK_STATUS_URL 与 HOOK_URL 相同（会重复触发部署），已跳过状态查询"
                      STATUS_URL=""
                  fi

                  # 1) 异步触发：宝塔侧 nohup 后台执行并立即返回 200，不等待部署完成
                  TRIGGER_CODE="$(curl -k -sS --connect-timeout 10 --max-time 30 \
                    "$TRIGGER_URL" \
                    -o /dev/null -w '%{http_code}' 2>/dev/null)" \
                    || TRIGGER_RC=$?
                  if [ -n "${TRIGGER_RC:-}" ] || [ "${TRIGGER_CODE:-000}" -lt 200 ] || [ "${TRIGGER_CODE:-000}" -ge 300 ]; then
                      echo "::warning::CVM 通知失败（curl 退出码 ${TRIGGER_RC:-0}，HTTP ${TRIGGER_CODE:-无}），站点可能未更新"
                      exit 0
                  fi
                  echo "已通知 CVM 开始部署（HTTP $TRIGGER_CODE）"

                  # 2) 尽力轮询服务器部署状态（约 6 次 × 8s），拿不到最终状态只警告、不判失败
                  if [ -z "$STATUS_URL" ]; then
                      echo "::warning::未配置 secrets.HOOK_STATUS_URL，已跳过服务器状态查询"
                      exit 0
                  fi
                  RESULT="unknown"
                  for i in 1 2 3 4 5 6; do
                      STATUS_RC=""
                      BODY_OUT="$(curl -k -sS --connect-timeout 5 --max-time 10 \
                        "$STATUS_URL" 2>/dev/null)" \
                        || STATUS_RC=$?
                      if [ -n "$STATUS_RC" ]; then
                          echo "::warning::第 ${i} 次查询服务器状态失败（curl 退出码 $STATUS_RC）"
                          sleep 8
                          continue
                      fi
                      ST="$(printf '%s' "$BODY_OUT" | grep -o '"status":"[a-z]*"' | head -n1 | cut -d'"' -f4)"
                      RUN="$(printf '%s' "$BODY_OUT" | grep -o '"run_id":"[^"]*"' | head -n1 | cut -d'"' -f4)"
                      if [ -z "$ST" ] || [ "$RUN" != "${{ github.run_id }}" ]; then
                          # 状态文件为空或还是上一次部署的，等部署脚本写入新状态
                          sleep 8
                          continue
                      fi
                      case "$ST" in
                          success) RESULT="success"; break ;;
                          failed)  RESULT="failed";  break ;;
                          *)       sleep 8 ;;
                      esac
                  done

                  case "$RESULT" in
                      success) echo "服务器部署状态：success" ;;
                      failed)  echo "::warning::CVM 部署失败，请检查 CVM 端 /www/webhook/ku2hakuasso-deploy.log" ;;
                      *)       echo "::warning::未获取到服务器最终部署状态（可能仍在部署中或状态服务不可用），请手动部署" ;;
                  esac

    # 3. 部署 GitHub Pages 跳转页（.github/page）
    # 仅本仓库执行（旧 fork 工作流已弃用）
    deploy_pages:
        if: github.repository == 'KukuhakuAsso/ku2hakuasso.site'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7 # 必须 checkout，才能拿到 .github 下的文件

            # 如果 .github/page 下只有 index.html，需要生成一份 404.html
            - name: Prepare Redirect Files
              run: |
                  mkdir -p page
                  cp .github/page/index.html page/index.html
                  cp .github/page/index.html page/404.html

            - name: Setup Pages
              uses: actions/configure-pages@v6
              with:
                  enablement: true

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: page # 上传处理后的目录

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
