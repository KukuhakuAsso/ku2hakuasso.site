name: Deploy (CVM Pull Mode & Git Pages Redirect)

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    # 1. 构建：主站 + 所有子项目，产物合并到 dist-preview
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Cache VitePress build cache
              uses: actions/cache@v6
              with:
                  path: |
                      docs/.vitepress/cache
                      vue-TelemetryInstruments/node_modules/.vite
                  key: ${{ runner.os }}-vitepress-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-vitepress-

            - name: Install & Build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: dist-preview
                  retention-days: 1

    # 2. 部署到 dist 分支（CVM 拉取模式）+ 触发钩子
    # 仅本仓库执行（旧 fork 工作流已弃用）
    deploy_dist:
        if: github.repository == 'KukuhakuAsso/ku2hakuasso.site'
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source
              uses: actions/checkout@v7

            - name: Download build artifact
              uses: actions/download-artifact@v8
              with:
                  name: site
                  path: dist-preview

            #把编译好的静态网页，推送到当前仓库的 dist 分支
            - name: Push Assets to Dist Branch
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: dist-preview # 编译产物目录
                  branch: dist # 专门存放打包后文件的分支（会自动创建）
                  token: ${{ secrets.GITHUB_TOKEN }} # 无需配置，GitHub 自动生成

            # 把构建产物打包成压缩包，发布到固定 build-latest Release
            - name: Pack site
              run: tar -czf site.tar.gz -C dist-preview .

            - name: Publish build release
              run: |
                  gh release delete build-latest --yes --cleanup-tag || true
                  gh release create build-latest site.tar.gz \
                    --title "Latest site build" \
                    --notes "自动构建产物，供 CVM 拉取" \
                    --latest

            # 通知 CVM：POST body 携带构建产物下载链接，宝塔 Webhook 会把它作为 $1 传给部署脚本
            # 输出重定向保留，避免泄漏服务器配置等敏感信息
            - name: Trigger hook
              run: |
                  ASSET_URL="https://github.com/${{ github.repository }}/releases/download/build-latest/site.tar.gz"
                  curl -k -sS --fail --retry 3 --retry-all-errors --retry-delay 5 \
                    -X POST "${{ secrets.HOOK_URL }}" \
                    --data-binary "$ASSET_URL" > /dev/null 2>&1 \
                    || { echo "::warning::Webhook 触发失败，请检查 CVM 端 webhook 服务"; exit 1; }

    # 3. 部署 GitHub Pages 跳转页（.github/page）
    # 仅本仓库执行（旧 fork 工作流已弃用）
    deploy_pages:
        if: github.repository == 'KukuhakuAsso/ku2hakuasso.site'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7 # 必须 checkout，才能拿到 .github 下的文件

            # 如果 .github/page 下只有 index.html，需要生成一份 404.html
            - name: Prepare Redirect Files
              run: |
                  mkdir -p page
                  cp .github/page/index.html page/index.html
                  cp .github/page/index.html page/404.html

            - name: Setup Pages
              uses: actions/configure-pages@v6
              with:
                  enablement: true

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: page # 上传处理后的目录

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
