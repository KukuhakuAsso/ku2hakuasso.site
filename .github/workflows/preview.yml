name: Repository Preview

on:
    push:
        branches: [main]
        paths:
            - "docs/**"
            - ".github/workflows/preview.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "projects.json"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: repository-preview
    cancel-in-progress: false

jobs:
    preview:
        if: github.repository == 'shiziyueyuan/ku2hakuasso.site'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.25.0

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v6

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

            - name: Build documentation preview
              env:
                  VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/
                  VITEPRESS_SITE_URL: https://${{ github.repository_owner }}.github.io
              run: pnpm run docs:build

            - name: Upload preview
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/.vitepress/dist

            - name: Deploy preview
              id: deployment
              uses: actions/deploy-pages@v5
