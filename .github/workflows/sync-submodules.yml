name: Sync submodules

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

# 防止定时触发与手动触发重叠运行，避免子模块指针冲突
concurrency:
    group: sync-submodules
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Update submodule pointers (latest main/master)
              run: node scripts/sync-submodules.mjs

            - name: Refresh lockfile
              run: pnpm install

            - name: Validate
              run: pnpm install --frozen-lockfile && pnpm run build

            - name: Create pull request
              env:
                  GH_TOKEN: ${{ secrets.BOT_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "::error::Configure the BOT_TOKEN repository secret with contents and pull request write access."
                    exit 1
                  fi
                  # 检测有无更新（含已暂存 gitlink 与 lockfile 改动）
                  if git diff --quiet HEAD; then
                    echo "No submodule updates available"
                    exit 0
                  fi
                  # 选择仓库最新的 main/master（默认分支）作为 PR 基础
                  default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name 2>/dev/null || echo main)
                  echo "默认分支: ${default_branch}"
                  git fetch --quiet origin "$default_branch"
                  branch="chore/sync-submodules-$(date -u +%Y%m%d)"
                  existing_branch_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
                  git checkout -b "$branch" "origin/$default_branch"
                  git add -A
                  git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync submodules'
                  # 守卫：校验新 gitlink 位于 main/master，失败则中止（不推送、不建 PR）
                  node scripts/check-submodules.mjs
                  if [ -n "$existing_branch_sha" ]; then
                    git push --force-with-lease="refs/heads/$branch:$existing_branch_sha" origin "$branch"
                  else
                    git push --set-upstream origin "$branch"
                  fi
                  existing_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
                  if [ -n "$existing_pr" ]; then
                    echo "Updated existing pull request #${existing_pr}"
                  else
                    gh pr create --base "$default_branch" --head "$branch" --title 'chore: sync submodules' --body 'Automated submodule update with frozen install and build validation.'
                  fi
