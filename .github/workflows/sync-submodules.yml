name: Sync submodules

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: check submodule branch is main/master
              run: |
                  set -euo pipefail
                  paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}') || true
                  [ -n "$paths" ] || { echo "::error::未找到任何子模块"; exit 1; }
                  while IFS= read -r path; do
                      branch=$(git config -f .gitmodules --get "submodule.${path}.branch" || true)
                      case "$branch" in
                          main|master) echo "✅ ${path} → branch=${branch}" ;;
                          *)
                              echo "::error::子模块 ${path} 的 branch 配置为 '${branch:-未配置}'，必须为 main/master"
                              exit 1
                              ;;
                      esac
                  done <<< "$paths"

            - name: Update submodule pointers
              run: |
                  set -euo pipefail
                  # 显式选择最新 main/master：逐个子模块拉取远端并检出其分支最新提交
                  while IFS= read -r path; do
                      branch=$(git config -f .gitmodules --get "submodule.${path}.branch")
                      case "$branch" in
                          main|master) ;;
                          *) echo "::error::子模块 ${path} 的 branch 配置非法（${branch}）"; exit 1 ;;
                      esac
                      echo "⏳ 更新 ${path} → 最新 ${branch} 分支..."
                      git -C "$path" fetch --quiet origin "$branch"
                      git -C "$path" checkout --quiet "origin/$branch"
                      git add "$path"
                      echo "✅ ${path} = $(git -C "$path" rev-parse --short HEAD)"
                  done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')

            - name: Refresh lockfile
              run: pnpm install

            - name: Validate
              run: pnpm install --frozen-lockfile && pnpm run build

            - name: Create pull request
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # 检测有无更新（含已暂存 gitlink 与 lockfile 改动）
                  if git diff --quiet HEAD; then
                    echo "No submodule updates available"
                    exit 0
                  fi
                  # 选择仓库最新的 main/master（默认分支）作为 PR 基础
                  default_branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name 2>/dev/null || echo main)
                  echo "默认分支: ${default_branch}"
                  git fetch --quiet origin "$default_branch"
                  branch="chore/sync-submodules-$(date -u +%Y%m%d)"
                  git checkout -b "$branch" "origin/$default_branch"
                  git add pnpm-lock.yaml vue-mistarg2anns vue-TelemetryInstruments
                  git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: sync submodules'
                  # 守卫：校验新 gitlink 位于 main/master，失败则中止（不推送、不建 PR）
                  node scripts/check-submodules.mjs
                  git push --set-upstream origin "$branch"
                  gh pr create --base "$default_branch" --head "$branch" --title 'chore: sync submodules' --body 'Automated submodule update with frozen install and build validation.'
